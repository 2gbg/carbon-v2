<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altın Fiyatı</title>
<style>
:root{--bg:#f2f2f7;--fg:#111;--muted:#6e6e76;--glass:rgba(255,255,255,.6);--edge:rgba(255,255,255,.9);--line:rgba(60,60,67,.12);--shade:rgba(0,0,0,.08);--gold:#b7820f;--goldbg:rgba(232,180,60,.16);--b1:#ffd77a;--b2:#a9c8ff;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--muted:#98989f;--glass:rgba(44,44,48,.55);--edge:rgba(255,255,255,.12);--line:rgba(255,255,255,.08);--shade:rgba(0,0,0,.5);--gold:#f2c14e;--goldbg:rgba(242,193,78,.14);--b1:#6b4a08;--b2:#16306b;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));-webkit-font-smoothing:antialiased;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.55;z-index:-1;pointer-events:none}
.a{background:var(--b1);width:60vmax;height:60vmax;top:-30vmax;left:-20vmax}.b{background:var(--b2);width:50vmax;height:50vmax;bottom:-25vmax;right:-20vmax}
main{max-width:480px;margin:0 auto;display:grid;gap:18px}
h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.03em}
.glass{background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:.5px solid var(--edge);box-shadow:0 8px 32px var(--shade),inset 0 1px 0 var(--edge);border-radius:26px;padding:20px}
form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
input{font:inherit;font-size:1.1rem;color:var(--fg);background:rgba(120,120,128,.12);border:0;border-radius:12px;padding:12px;min-width:0;width:100%}
input:focus{outline:2px solid var(--gold)}
.big small,.cell small{display:block;font-size:.8rem;color:var(--muted)}
.big b{display:block;font-size:3rem;font-weight:800;letter-spacing:-.04em;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.big b span{font-size:1.4rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cell{background:var(--goldbg);border-radius:16px;padding:12px}
.cell b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:.75rem;text-align:center;margin:0}
.err{color:var(--err)}
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>
<main>
  <h1>Altın Fiyatı</h1>
  <form class="glass" id="f">
    <div class="two">
      <label for="amount">Betrag in ₺<input id="amount" type="number" min="0" step="any" inputmode="decimal" value="70000"></label>
      <label for="date">Datum<input id="date" type="date" min="2024-03-02"></label>
    </div>
  </form>
  <section class="glass" id="out"><p class="note">Lade Kurse…</p></section>
  <p class="note">Tageskurse: fawazahmed0 Currency-API, ab 02.03.2024. Gold = 24 Karat Marktpreis, ohne Juwelier-Aufschlag.</p>
</main>
<script>
const OZ=31.1034768,$=id=>document.getElementById(id);
$('date').value=$('date').max=new Date().toISOString().slice(0,10);
const n=(x,d=2)=>x.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const cache={};
async function rates(date){
  if(cache[date])return cache[date];
  const tags=[];const base=new Date(date+'T12:00:00Z');
  for(let i=0;i<7;i++){const d=new Date(base-i*864e5).toISOString().slice(0,10);if(d>='2024-03-02')tags.push(d)}
  if(date>=new Date(Date.now()-3*864e5).toISOString().slice(0,10))tags.unshift('latest');
  let reached=false;
  for(const tag of tags){
    const urls=[`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${tag}/v1/currencies/try.min.json`,`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${tag}/v1/currencies/try.json`,`https://${tag}.currency-api.pages.dev/v1/currencies/try.json`];
    for(const u of urls){
      try{const r=await fetch(u);reached=true;if(r.ok){const j=await r.json();if(j.try&&j.try.xau)return cache[date]=j}}catch(e){}
    }
  }
  if(!reached)throw new Error('Keine Verbindung zum Kursdienst. Bitte die Datei direkt in Safari/Chrome öffnen (nicht in der Vorschau) und Internet prüfen.');
  throw new Error(date<'2024-03-02'?'Kurse gibt es erst ab 02.03.2024.':'Für dieses Datum wurden keine Kurse gefunden.');
}
let tok=0;
async function run(){
  const my=++tok,amount=parseFloat($('amount').value)||0,date=$('date').value,out=$('out');
  try{
    const d=await rates(date);if(my!==tok)return;
    const t=d.try,gp=1/(t.xau*OZ),eur=1/t.eur;
    out.innerHTML=`<div class="big"><small>${n(amount,0)} ₺ am ${new Date(d.date).toLocaleDateString('de-DE')} =</small><b>${n(amount/gp,3)} <span>g Gold</span></b></div>
    <div class="grid">
      <div class="cell"><small>In Euro</small><b>${n(amount/eur)} €</b></div>
      <div class="cell"><small>1 g Gold</small><b>${n(gp)} ₺</b></div>
      <div class="cell"><small>1 g Gold in €</small><b>${n(gp/eur)} €</b></div>
      <div class="cell"><small>1 €</small><b>${n(eur,4)} ₺</b></div>
    </div>`;
  }catch(e){if(my===tok)out.innerHTML=`<p class="err">${e.message}</p>`}
}
$('amount').addEventListener('input',run);$('date').addEventListener('change',run);
$('f').addEventListener('submit',e=>{e.preventDefault();run()});
run();
</script>
</body>
</html>
